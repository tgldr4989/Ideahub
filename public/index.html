<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coremind Idea Hub</title>
<link rel="icon" href="assets/coremind-10.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/post.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/forms.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Sign-in -->
<div class="signin" id="signin" hidden>
  <form class="signin-card" id="signinForm" autocomplete="on">
    <img src="assets/coremind-10.webp" alt="Coremind 10 years">
    <h1>Welcome to Idea Hub</h1>
    <p>Share hackathon ideas and ways to improve how we work. React to the ones you love — the best rise to the top.</p>
    <label>Work email<input class="input" id="sEmail" name="username" autocomplete="username" maxlength="120" required></label>
    <label>Password<input class="input" id="sPass" name="password" type="password" autocomplete="current-password" required></label>
    <p style="font-size:12px;margin:0">Use your Coremind computer (Windows) password.</p>
    <div class="err" id="sErr"></div>
    <button class="btn-primary" id="sBtn">Continue</button>
  </form>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" data-filter="all">
      <img src="assets/coremind-10.webp" alt="Coremind 10 years">
      <div class="brand-name">Idea Hub<small data-i18n="brandSub"></small></div>
    </a>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" data-i18n-ph="search">
    </label>
    <button class="btn-primary" data-open-new><span class="plus">＋</span> <span data-i18n="newIdea"></span></button>
    <button class="me-btn" id="meBtn" data-profile="me" aria-label="Profile"></button>
  </div>
</header>

<div class="layout">
  <aside class="rail">
    <nav class="nav" id="nav">
      <a href="#/" class="active" data-filter="all"><span class="ico">🏠</span> <span data-i18n="navAll"></span> <span class="count" data-count="all"></span></a>
      <a href="#/" data-filter="hack"><span class="ico">⚡</span> <span data-i18n="navHack"></span> <span class="count" data-count="hack"></span></a>
      <a href="#/" data-filter="proc"><span class="ico">⚙️</span> <span data-i18n="navProc"></span> <span class="count" data-count="proc"></span></a>
      <a href="#/" data-filter="mine"><span class="ico">💡</span> <span data-i18n="navMine"></span> <span class="count" data-count="mine"></span></a>
    </nav>
    <button class="btn-primary" data-open-new><span class="plus">＋</span> <span data-i18n="shareIdea"></span></button>
  </aside>

  <main>
    <div id="feedView">
      <div class="stories" id="stories"></div>
      <div class="feed-head">
        <h1 id="feedTitle"></h1>
        <div class="tabs" id="sortTabs">
          <button class="active" data-sort="top" data-i18n="sortTop"></button>
          <button data-sort="new" data-i18n="sortNew"></button>
        </div>
      </div>
      <section class="feed" id="feed"></section>
    </div>
    <div id="profileView" hidden>
      <button class="back" data-go-feed data-i18n="back"></button>
      <div id="profileCard"></div>
      <h3 class="p-ideas-title" id="profileIdeasTitle"></h3>
      <section class="feed" id="profileFeed"></section>
    </div>
  </main>

  <aside class="aside">
    <div class="panel anniv">
      <div class="logo-chip"><img src="assets/coremind-10.webp" alt="Coremind 10"></div>
      <h5 data-i18n="annivTitle"></h5>
      <p data-i18n="annivText"></p>
      <div class="countdown" id="countdown">
        <div><b>--</b><small data-i18n="days"></small></div>
        <div><b>--</b><small data-i18n="hours"></small></div>
        <div><b>--</b><small data-i18n="mins"></small></div>
      </div>
    </div>

    <div class="panel">
      <h4><span data-i18n="leaderboard"></span> <a href="#/" data-sort-link data-i18n="seeAll"></a></h4>
      <ol class="leader" id="leader"></ol>
    </div>

    <div class="panel">
      <div class="stats">
        <div><b id="statIdeas">0</b><small data-i18n="statIdeas"></small></div>
        <div><b id="statReacts">0</b><small data-i18n="statReacts"></small></div>
        <div><b id="statPeople">0</b><small data-i18n="statPeople"></small></div>
      </div>
    </div>
  </aside>
</div>

<button class="fab" data-open-new aria-label="New idea">＋</button>

<!-- New idea modal -->
<div class="scrim" id="scrim">
  <form class="modal" id="form" autocomplete="off">
    <div class="modal-head">
      <h2 id="formTitle" data-i18n="newTitle"></h2>
      <button type="button" class="x" data-close aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label data-i18n="kind"></label>
        <div class="type-switch">
          <button type="button" class="type-opt on" data-type="hack">
            <span class="big">⚡</span><span><b data-i18n="hackIdea"></b><small data-i18n="hackSub"></small></span>
          </button>
          <button type="button" class="type-opt" data-type="proc">
            <span class="big">⚙️</span><span><b data-i18n="procIdea"></b><small data-i18n="procSub"></small></span>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="fTitle" data-i18n="fTitle"></label>
        <input id="fTitle" class="input title" maxlength="90" data-i18n-ph="fTitlePh">
        <div class="counter"><span id="tCount">0</span>/90</div>
      </div>
      <div class="field">
        <label for="fDesc"><span data-i18n="fDesc"></span> <em data-i18n="optional"></em></label>
        <textarea id="fDesc" class="textarea" maxlength="600" data-i18n-ph="fDescPh"></textarea>
      </div>
      <div class="field">
        <label for="fTags"><span data-i18n="fTags"></span> <em data-i18n="tagsHint"></em></label>
        <input id="fTags" class="input" data-i18n-ph="fTagsPh">
      </div>
      <div class="field">
        <label><span data-i18n="fImage"></span> <em data-i18n="optional"></em></label>
        <div class="drop" id="drop"></div>
        <input type="file" id="fImg" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <div class="hint" data-i18n="imgHint"></div>
      </div>
    </div>
    <div class="modal-foot">
      <div class="err" id="fErr"></div>
      <button type="button" class="btn-ghost" data-close data-i18n="cancel"></button>
      <button type="submit" class="btn-primary" id="submitBtn" disabled data-i18n="postIdea"></button>
    </div>
  </form>
</div>

<!-- Edit profile modal -->
<div class="scrim" id="profileScrim">
  <form class="modal" id="profileForm" autocomplete="off">
    <div class="modal-head">
      <h2 data-i18n="editProfile"></h2>
      <button type="button" class="x" data-close-profile aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label data-i18n="photo"></label>
        <div class="photo-row">
          <div id="pPhotoPreview"></div>
          <div class="btns">
            <button type="button" class="btn-soft" id="pPhotoPick" data-i18n="changePhoto"></button>
            <button type="button" class="btn-ghost" id="pPhotoRemove" data-i18n="remove"></button>
          </div>
        </div>
        <input type="file" id="pPhotoFile" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      </div>
      <div class="field">
        <label for="pName" data-i18n="displayName"></label>
        <input id="pName" class="input" maxlength="60">
        <div class="hint" id="pNameHint"></div>
      </div>
      <div class="field">
        <label for="pPosition" data-i18n="position"></label>
        <input id="pPosition" class="input" maxlength="60" data-i18n-ph="positionPh">
      </div>
      <div class="field">
        <label for="pBio" data-i18n="bio"></label>
        <textarea id="pBio" class="textarea short" maxlength="160" data-i18n-ph="bioPh"></textarea>
        <div class="counter"><span id="pBioCount">0</span>/160</div>
      </div>
      <div class="two-col">
        <div class="field"><label for="pDept" data-i18n="dept"></label><input id="pDept" class="input" disabled></div>
        <div class="field"><label for="pEmail" data-i18n="email"></label><input id="pEmail" class="input" disabled></div>
      </div>
      <div class="hint" data-i18n="fromAccount"></div>
    </div>
    <div class="modal-foot">
      <div class="err" id="pErr"></div>
      <button type="button" class="btn-ghost" data-close-profile data-i18n="cancel"></button>
      <button type="submit" class="btn-primary" id="pSave" data-i18n="save"></button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
