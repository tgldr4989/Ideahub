<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coremind Idea Hub</title>
<link rel="icon" href="assets/coremind-10.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2f3fe0;
    --indigo: #4b2fd6;
    --violet: #7a2be2;
    --cyan: #1ec8e6;
    --teal: #3fe0b5;
    --grad-brand: linear-gradient(135deg, #2f3fe0 0%, #7a2be2 100%);
    --grad-ring: conic-gradient(from 200deg, #2f3fe0, #7a2be2, #1ec8e6, #3fe0b5, #2f3fe0);
    --bg: #f4f5fb;
    --card: #ffffff;
    --ink: #14143a;
    --ink-2: #4a4c6e;
    --ink-3: #8a8ca8;
    --line: #e7e8f2;
    --danger: #d6375a;
    --shadow: 0 1px 2px rgba(20,20,58,.04), 0 8px 24px rgba(20,20,58,.06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
  input, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.86);
    backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .brand img { height: 44px; display: block; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.02em; line-height: 1.1; }
  .brand-name small { display: block; font-weight: 600; font-size: 11px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .search {
    flex: 1; max-width: 380px; margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
  }
  .search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 14px; }
  .search svg { flex: none; color: var(--ink-3); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--grad-brand); color: #fff; font-weight: 700; font-size: 14px;
    padding: 11px 18px; border-radius: 12px;
    box-shadow: 0 6px 18px rgba(75,47,214,.32);
    transition: transform .15s ease, box-shadow .15s ease;
    white-space: nowrap;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(75,47,214,.38); }
  .btn-primary .plus { font-size: 18px; line-height: 1; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-soft {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .btn-soft:hover { background: #ecedf8; }
  .me-btn { flex: none; display: block; border-radius: 50%; }

  /* ---------- Avatars ---------- */
  .avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; padding: 2px; background: var(--grad-ring); display: block; }
  .avatar.sm { width: 38px; height: 38px; }
  .avatar.xs { width: 30px; height: 30px; padding: 1.5px; }
  .avatar.xl { width: 104px; height: 104px; padding: 4px; }
  .avatar b, .avatar img {
    width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 800; object-fit: cover;
  }
  .avatar.xs b { font-size: 11px; border-width: 1.5px; }
  .avatar.xs img { border-width: 1.5px; }
  .avatar.xl b { font-size: 34px; border-width: 4px; }
  .avatar.xl img { border-width: 4px; }
  .link { cursor: pointer; }
  .link:hover { text-decoration: underline; }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px;
    display: grid; grid-template-columns: 220px minmax(0, 560px) 300px; gap: 32px;
    justify-content: center;
  }
  .rail, .aside { position: sticky; top: 92px; align-self: start; }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px;
    color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 15px;
  }
  .nav a:hover { background: #fff; }
  .nav a.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .nav a .ico { width: 22px; text-align: center; font-size: 17px; }
  .nav .count { margin-left: auto; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .rail .btn-primary { width: 100%; justify-content: center; margin-top: 18px; padding: 13px; }

  /* ---------- Category circles ---------- */
  .stories {
    display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 6px;
    scrollbar-width: none;
  }
  .stories::-webkit-scrollbar { display: none; }
  .story { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 74px; }
  .story-ring {
    width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: var(--line);
    transition: transform .15s ease;
  }
  .story.active .story-ring, .story:hover .story-ring { background: var(--grad-ring); }
  .story:hover .story-ring { transform: scale(1.04); }
  .story-inner {
    width: 100%; height: 100%; border-radius: 50%; border: 3px solid #fff;
    display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, #eef0ff, #e8fbf7);
  }
  .story span { font-size: 12px; font-weight: 600; color: var(--ink-2); max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .story.active span { color: var(--ink); }

  /* ---------- Sort tabs ---------- */
  .feed-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  .feed-head h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .tabs { flex: none; display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
  .tabs button.active { background: var(--ink); color: #fff; }

  /* ---------- Idea post ---------- */
  .feed { display: flex; flex-direction: column; gap: 22px; }
  .post {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .post-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .who { min-width: 0; }
  .who .name { font-weight: 700; font-size: 14px; }
  .who .meta { font-size: 12px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill {
    margin-left: auto; flex: none; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 999px;
  }
  .pill.hack { background: #efeaff; color: var(--violet); }
  .pill.proc { background: #e2f9f3; color: #0f9a78; }
  .del { flex: none; width: 32px; height: 32px; border-radius: 10px; color: var(--ink-3); display: grid; place-items: center; }
  .del:hover { background: #fdebef; color: var(--danger); }
  .del.edit:hover { background: #f1edff; color: var(--indigo); }
  .pill + .del { margin-left: 2px; }

  .media { position: relative; overflow: hidden; }
  .media img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--bg); }
  .text-cover {
    position: relative; aspect-ratio: 16 / 10; padding: 34px 32px;
    display: flex; flex-direction: column; justify-content: center; overflow: hidden;
    color: #fff;
  }
  .text-cover::before, .text-cover::after { content: ""; position: absolute; border-radius: 50%; opacity: .35; }
  .text-cover::before { width: 280px; height: 280px; right: -90px; top: -110px; border: 36px solid rgba(255,255,255,.4); }
  .text-cover::after  { width: 160px; height: 160px; left: -60px; bottom: -70px; background: rgba(255,255,255,.25); }
  .text-cover .q { font-size: 64px; line-height: .6; font-weight: 800; opacity: .45; margin-bottom: 14px; }
  .text-cover h2 { position: relative; z-index: 1; margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -.02em; font-weight: 800; text-wrap: balance; overflow-wrap: anywhere; }
  .text-cover .tagline { position: relative; z-index: 1; margin-top: 16px; font-size: 13px; font-weight: 600; opacity: .85; }
  .cover-1 { background: linear-gradient(140deg, #2f3fe0, #7a2be2); }
  .cover-2 { background: linear-gradient(140deg, #1aa9d6, #3fe0b5); }
  .cover-3 { background: linear-gradient(140deg, #4b2fd6, #1ec8e6); }
  .cover-4 { background: linear-gradient(140deg, #14143a, #4b2fd6); }

  .rank {
    position: absolute; z-index: 2; top: 14px; left: 14px;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.95); color: var(--ink); font-weight: 800; font-size: 12px;
    padding: 6px 10px 6px 8px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .rank.gold { background: linear-gradient(135deg, #ffe58a, #ffc83d); }

  /* ---------- Reactions ---------- */
  .actions { display: flex; align-items: center; gap: 6px; padding: 10px 12px 0; }
  .act {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 12px;
    font-size: 14px; font-weight: 700; color: var(--ink-2); transition: background .15s ease, transform .12s ease;
  }
  .act:hover { background: var(--bg); }
  .act:active { transform: scale(.95); }
  .act .e { font-size: 18px; line-height: 1; }
  .act svg { color: var(--ink-3); }
  .act.mine { color: var(--indigo); background: #f1edff; }
  .act.mine.pop .e { animation: pop .45s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.6) rotate(-8deg)} 100%{transform:scale(1)} }
  .actions .totals { margin-left: auto; font-size: 13px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .actions .totals button:hover { color: var(--ink); text-decoration: underline; }

  .react-wrap { position: relative; }
  .picker {
    position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 15;
    display: flex; gap: 2px; padding: 6px; background: #fff; border-radius: 999px;
    box-shadow: 0 12px 32px rgba(20,20,58,.22), 0 0 0 1px var(--line);
    opacity: 0; transform: translateY(8px) scale(.9); transform-origin: 20px 100%; pointer-events: none;
    transition: opacity .16s ease, transform .2s cubic-bezier(.3,1.5,.5,1);
  }
  .react-wrap.open .picker { opacity: 1; transform: none; pointer-events: auto; }
  .picker button {
    position: relative; width: 44px; height: 44px; border-radius: 50%; font-size: 28px; line-height: 1;
    display: grid; place-items: center; transition: transform .15s cubic-bezier(.3,1.8,.5,1);
  }
  .picker button:hover { transform: translateY(-6px) scale(1.3); }
  .picker button.on { background: #f1edff; }
  .picker button::after {
    content: attr(data-label); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%) scale(.75);
    background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s ease;
  }
  .picker button:hover::after { opacity: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px; border-radius: 999px;
    background: var(--bg); border: 1.5px solid transparent; font-size: 13px; font-weight: 700; color: var(--ink-2);
    transition: transform .12s ease, background .15s ease;
  }
  .chip .e { font-size: 15px; line-height: 1; }
  .chip:hover { background: #ecedf8; }
  .chip:active { transform: scale(.94); }
  .chip.on { background: #f1edff; border-color: #b9a6ff; color: var(--indigo); }

  .post-body { padding: 10px 16px 6px; }
  .post-body:empty { display: none; }
  .post-body h3 { margin: 2px 0 6px; font-size: 17px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .post-body p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tags button { font-size: 12px; font-weight: 700; color: var(--blue); }
  .tags button:hover { text-decoration: underline; }

  /* ---------- Comments ---------- */
  .comments { padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .view-all { align-self: flex-start; font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .view-all:hover { color: var(--ink); }
  .comment { display: flex; gap: 8px; align-items: flex-start; }
  .c-body { min-width: 0; }
  .bubble { background: var(--bg); border-radius: 4px 14px 14px 14px; padding: 8px 12px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
  .bubble .c-name { display: block; font-weight: 700; font-size: 13px; margin-bottom: 1px; }
  .c-meta { font-size: 11px; color: var(--ink-3); margin: 3px 0 0 4px; }
  .c-meta button { font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .c-meta button:hover { color: var(--danger); }
  .comment-form { display: flex; align-items: center; gap: 8px; }
  .comment-input {
    flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 14px; font-size: 14px;
    outline: 0; background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  .comment-input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(75,47,214,.12); }
  .send { font-weight: 800; font-size: 14px; color: var(--indigo); padding: 6px 4px; }
  .comment-input:placeholder-shown + .send { opacity: .35; pointer-events: none; }

  /* ---------- Profile ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--ink-2); margin-bottom: 14px; }
  .back:hover { color: var(--ink); }
  .profile-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px; }
  .profile-cover {
    height: 120px; position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, #1ec8e6 0%, transparent 55%), var(--grad-brand);
  }
  .profile-cover::before { content: ""; position: absolute; width: 220px; height: 220px; right: -60px; top: -90px; border-radius: 50%; border: 30px solid rgba(255,255,255,.18); }
  .profile-cover::after { content: ""; position: absolute; width: 120px; height: 120px; left: 30%; bottom: -70px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .profile-main { padding: 0 22px 22px; position: relative; }
  .profile-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: -52px; }
  .profile-top .avatar { box-shadow: 0 8px 24px rgba(20,20,58,.18); }
  .profile-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-bottom: 6px; }
  .profile-main h2 { margin: 14px 0 2px; font-size: 22px; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .p-meta { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .p-email { font-size: 13px; color: var(--ink-3); margin-top: 2px; overflow-wrap: anywhere; }
  .p-bio { margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
  .p-bio.empty { color: var(--ink-3); font-style: italic; }
  .p-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; }
  .p-stats div { text-align: center; padding: 12px 6px; }
  .p-stats div + div { border-left: 1px solid var(--line); }
  .p-stats b { display: block; font-size: 22px; letter-spacing: -.02em;
    background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .p-stats small { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .lang-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .lang-row > span { font-size: 14px; font-weight: 700; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
  .seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(20,20,58,.12); }
  .p-ideas-title { font-size: 17px; margin: 0 0 14px; letter-spacing: -.01em; }

  /* ---------- Right aside ---------- */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .panel h4 { margin: 0 0 14px; font-size: 14px; letter-spacing: -.01em; display: flex; align-items: center; justify-content: space-between; }
  .panel h4 a { font-size: 12px; color: var(--blue); text-decoration: none; font-weight: 700; }

  .anniv {
    position: relative; overflow: hidden; padding: 20px; color: #fff;
    background: radial-gradient(120% 120% at 100% 0%, #1ec8e6 0%, transparent 55%), var(--grad-brand);
    border: 0;
  }
  .anniv .logo-chip { background: #fff; border-radius: 14px; padding: 10px 12px; display: inline-block; margin-bottom: 14px; }
  .anniv .logo-chip img { height: 54px; display: block; }
  .anniv h5 { margin: 0; font-size: 18px; line-height: 1.3; letter-spacing: -.01em; }
  .anniv p { margin: 6px 0 16px; font-size: 13px; opacity: .85; line-height: 1.5; }
  .countdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .countdown div { background: rgba(255,255,255,.16); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .countdown b { display: block; font-size: 20px; }
  .countdown small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }

  .leader { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .leader li { display: flex; align-items: center; gap: 10px; }
  .leader .n {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; background: var(--bg); color: var(--ink-2);
  }
  .leader li:first-child .n { background: linear-gradient(135deg, #ffe58a, #ffc83d); color: #6b4a00; }
  .leader .t { font-size: 13px; font-weight: 600; line-height: 1.35; min-width: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .leader .c { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .leader .none { font-size: 13px; color: var(--ink-3); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats b { display: block; font-size: 20px; letter-spacing: -.02em;
    background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats small { font-size: 11px; color: var(--ink-3); font-weight: 600; }

  /* ---------- Modals ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 50; background: rgba(20,20,58,.45); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .scrim.open { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0 } }
  .modal {
    width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto;
    background: #fff; border-radius: 22px; box-shadow: 0 30px 80px rgba(20,20,58,.35);
    animation: rise .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes rise { from { transform: translateY(16px) scale(.98); opacity: 0 } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .x { width: 34px; height: 34px; border-radius: 10px; font-size: 20px; color: var(--ink-3); }
  .x:hover { background: var(--bg); }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .field label em { font-style: normal; color: var(--ink-3); font-weight: 500; }
  .type-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-opt {
    text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .type-opt .big { font-size: 22px; }
  .type-opt b { display: block; font-size: 14px; }
  .type-opt small { color: var(--ink-3); font-size: 12px; }

  .input, .textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; outline: 0;
    background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  .input:focus, .textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(75,47,214,.12); }
  .input:disabled { background: var(--bg); color: var(--ink-2); }

  .textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
  .textarea.short { min-height: 80px; }
  .counter { text-align: right; font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .drop {
    border: 1.5px dashed #c9cbe0; border-radius: 14px; padding: 18px; text-align: center; color: var(--ink-3); font-size: 13px;
    cursor: pointer; transition: border-color .15s, background .15s; position: relative; overflow: hidden;
  }
  .drop:hover { border-color: var(--indigo); background: #faf9ff; }
  .drop b { color: var(--indigo); }
  .drop img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
  .drop .rm { position: absolute; top: 26px; right: 26px; background: rgba(0,0,0,.6); color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  .err { color: var(--danger); font-size: 13px; font-weight: 600; }

  .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 22px 20px; border-top: 1px solid var(--line); }
  .modal-foot .err { margin-right: auto; }
  .btn-ghost { padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--bg); }
  .photo-row { display: flex; align-items: center; gap: 16px; }
  .photo-row .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px;

    overflow: auto;
  }
  .signin-card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 28px;
    box-shadow: 0 30px 80px rgba(20,20,58,.18); display: flex; flex-direction: column; gap: 14px;
  }
  .signin-card img { height: 96px; align-self: center; }
  .signin-card h1 { margin: 6px 0 0; font-size: 22px; text-align: center; letter-spacing: -.02em; }

  .signin-card label { font-size: 13px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .signin-card .btn-primary { justify-content: center; padding: 13px; margin-top: 4px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; z-index: 80;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600;
    transition: all .25s ease; pointer-events: none; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fab {
    display: none; position: fixed; right: 18px; bottom: 18px; z-index: 30;
    width: 58px; height: 58px; border-radius: 18px; background: var(--grad-brand); color: #fff; font-size: 30px;
    box-shadow: 0 10px 26px rgba(75,47,214,.45);
  }

  .empty { text-align: center; color: var(--ink-3); padding: 48px 16px; font-size: 14px; background: #fff; border: 1.5px dashed var(--line); border-radius: var(--radius); }
  .empty b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .empty .btn-primary { margin-top: 16px; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 560px) 300px; }
    .rail { display: none; }
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 560px); padding: 16px 16px 100px; }
    .aside { display: none; }
    .topbar .btn-primary { display: none; }
    .fab { display: grid; place-items: center; }
    .brand-name { display: none; }
  }
  @media (max-width: 520px) {

let lang = (() => {
  try { const saved = localStorage.getItem("ideahub.lang"); if (saved === "en" || saved === "mn") return saved; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("mn") ? "mn" : "en";
})();
function t(key, vars = {}) {
  const v = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  if (typeof v === "function") return v(vars.n);
  return v.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
}
function setLang(next, persist) {
  lang = next;
  try { localStorage.setItem("ideahub.lang", next); } catch {}
  if (persist && me) api("PUT", "/api/me/lang", { lang: next }).catch(() => {});
  applyI18n();
}
function setFirstText(el, text) {
  // Labels hold their input; only replace the text in front of it.
  const node = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
  if (node) node.textContent = text; else el.prepend(text);
}
function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  // sign-in screen text (its form and sign-in logic stay as they are)
  $("#signin h1").textContent = t("welcome");
  const ps = $("#signinForm").querySelectorAll("p");
  ps[0].textContent = t("signinIntro");
  ps[1].textContent = t("pwHint");
  const labels = $("#signinForm").querySelectorAll("label");
  setFirstText(labels[0], t("workEmail"));
  setFirstText(labels[1], t("password"));
  $("#sBtn").textContent = t("continue");
  showImage();
  if (editing) { $("#formTitle").textContent = t("editTitle"); $("#submitBtn").textContent = t("saveChanges"); }
  renderStories();
  setFilterTitle();
  render(false);
}

const $ = s => document.querySelector(s);
const total = i => Object.values(i.r).reduce((a, b) => a + b, 0);
const initials = n => n.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const colorFor = n => AV_COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function avatarHTML(name, photo, cls = "", userId = null) {
  const inner = photo ? `<img src="${esc(photo)}" alt="">` : `<b style="background:${colorFor(name)}">${esc(initials(name))}</b>`;
  return userId != null
    ? `<button class="avatar ${cls}" data-profile="${userId}" title="${esc(name)}">${inner}</button>`
    : `<div class="avatar ${cls}">${inner}</div>`;
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return t("justNow");
  if (m < 60) return t("mAgo", { n: m });
  const h = Math.round(m / 60);
  return h < 24 ? t("hAgo", { n: h }) : t("dAgo", { n: Math.round(h / 24) });
}

// ---------------------------------------------------------------- API
async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== "/api/login") showSignIn();
  if (!res.ok) {
    const msg = data.error || t("genericError");
    throw new Error(lang === "mn" ? SERVER_ERRORS_MN[msg] || msg : msg);
  }
  return data;
}

async function load(animate, force) {
  const data = await api("GET", "/api/ideas");
  const snap = JSON.stringify(data.ideas);
  if (snap === snapshot && !force) return;
  snapshot = snap;
  ideas = data.ideas;
  render(animate);
}

// ---------------------------------------------------------------- render
function visible() {
  let list = ideas.filter(i => {
    if (filter === "hack" || filter === "proc") return i.type === filter;
    if (filter === "mine") return i.mine;
    if (filter.startsWith("#")) return i.tags.some(tag => tag.toLowerCase() === filter.slice(1).toLowerCase());
    return true;
  });
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(i => (i.title + " " + i.desc + " " + i.author + " " + i.tags.join(" ")).toLowerCase().includes(q));
  }
  return list.sort(byTop(sort === "top"));
}
const byTop = top => top ? (a, b) => total(b) - total(a) || b.t - a.t : (a, b) => b.t - a.t;
const topRanking = () => [...ideas].sort(byTop(true));

function reactionsHTML(i) {
  const mine = i.myReaction && REACTION[i.myReaction];
  const btn = mine
    ? `<button class="act mine" data-react-main="${i.id}"><span class="e">${mine.e}</span><span class="lbl">${t(mine.label)}</span></button>`
    : `<button class="act" data-react-main="${i.id}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 2 3.5 2 3.5-2 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg><span class="lbl">${t("react")}</span></button>`;
  const picker = REACTIONS.map(x =>
    `<button class="${i.myReaction === x.k ? "on" : ""}" data-pick="${x.k}" data-id="${i.id}" data-label="${esc(t(x.label))}" aria-label="${esc(t(x.label))}">${x.e}</button>`).join("");
  const n = total(i), c = i.comments.length;
  const totals = [n ? t("nReactions", { n }) : "", c ? `<button data-expand="${i.id}">${t("nComments", { n: c })}</button>` : ""]
    .filter(Boolean).join(" · ");
  const reacted = REACTIONS.filter(x => i.r[x.k] > 0).sort((a, b) => i.r[b.k] - i.r[a.k]);
  const chips = reacted.length ? `<div class="chips">${reacted.map(x =>
    `<button class="chip ${i.myReaction === x.k ? "on" : ""}" data-react="${x.k}" data-id="${i.id}" title="${esc(t(x.label))}"><span class="e">${x.e}</span>${i.r[x.k]}</button>`).join("")}</div>` : "";
  return `
    <div class="actions">
      <div class="react-wrap" data-wrap="${i.id}">${btn}<div class="picker">${picker}</div></div>
      <button class="act" data-focus-comment="${i.id}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12Z"/></svg><span class="lbl">${t("comment")}</span></button>
      <span class="totals">${totals}</span>
    </div>${chips}`;
}

function commentsHTML(i) {
  const all = i.comments;
  const open = expanded.has(i.id);
  const shown = open ? all : all.slice(-COMMENTS_PREVIEW);
  const toggle = all.length > COMMENTS_PREVIEW
    ? `<button class="view-all" data-expand="${i.id}">${open ? t("showLess") : t("viewAll", { n: all.length })}</button>` : "";
  const items = shown.map(c => `
    <div class="comment">
      ${avatarHTML(c.name, c.avatar, "xs", c.userId)}
      <div class="c-body">
        <div class="bubble"><span class="c-name link" data-profile="${c.userId}">${esc(c.name)}</span>${esc(c.body)}</div>

  return `

        <button class="send" type="submit">${t("send")}</button>
      </form>

}

function postHTML(i) {
  const rankPos = topRanking().indexOf(i) + 1;

  const media = i.img
    ? `<div class="media">${rank}<img src="${esc(i.img)}" alt="" loading="lazy"></div>`
    : `<div class="media">${rank}<div class="text-cover cover-${+i.cover || 1}">

  const body = (i.img ? `<h3>${esc(i.title)}</h3>` : "") + (i.desc ? `<p>${esc(i.desc)}</p>` : "")
    + (i.tags.length ? `<div class="tags">${i.tags.map(tag => `<button data-tag="${esc(tag)}">#${esc(tag)}</button>`).join("")}</div>` : "");

      ${i.mine ? `<button class="del" data-delete="${i.id}" title="${esc(t("deleteIdea"))}" aria-label="${esc(t("deleteIdea"))}">

function emptyHTML() {
  if (view === "profile") return `<div class="empty"><b>${t("noIdeasProfile")}</b>${profile?.me ? `<button class="btn-primary" data-open-new><span class="plus">＋</span> ${t("shareIdea")}</button>` : ""}</div>`;

  if (filter === "mine") return `<div class="empty"><b>${t("noMine")}</b>${t("noMineSub")}<br><button class="btn-primary" data-open-new><span class="plus">＋</span> ${t("shareIdea")}</button></div>`;

// Re-render the visible list; FLIP-animate cards that changed position
function render(animate) {
  closePicker();
  const container = view === "feed" ? $("#feed") : $("#profileFeed");
  const before = {};
  if (animate) container.querySelectorAll(".post").forEach(el => before[el.dataset.post] = el.getBoundingClientRect().top);
  const list = view === "feed" ? visible() : ideas.filter(i => profile && i.authorId === profile.id).sort(byTop(true));
  if (view === "profile") renderProfileCard();
  container.innerHTML = list.length ? list.map(postHTML).join("") : emptyHTML();
  if (animate) container.querySelectorAll(".post").forEach(el => {
    const prev = before[el.dataset.post];
    if (prev == null) return;
    const dy = prev - el.getBoundingClientRect().top;
    if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 450, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
  renderSide();
}

function renderSide() {
  const top = topRanking().filter(i => total(i) > 0).slice(0, 5);
  $("#leader").innerHTML = top.length ? top.map((i, n) =>
    `<li><span class="n">${n + 1}</span><span class="t">${esc(i.title)}</span><span class="c">${total(i)}</span></li>`).join("")
    : `<li class="none">${t("noReactionsYet")}</li>`;
  $("#statIdeas").textContent = ideas.length;
  $("#statReacts").textContent = ideas.reduce((a, i) => a + total(i), 0);
  $("#statPeople").textContent = new Set(ideas.map(i => i.authorId)).size;
  const counts = { all: ideas.length, hack: ideas.filter(i => i.type === "hack").length,
                   proc: ideas.filter(i => i.type === "proc").length, mine: ideas.filter(i => i.mine).length };
  document.querySelectorAll("[data-count]").forEach(el => el.textContent = counts[el.dataset.count]);
}

async function loadProfile(id) {

// Hash routes: #/ = feed, #/u/<id> = someone's profile
async function route() {
  const m = location.hash.match(/^#\/u\/(\d+)$/);
  const next = m ? "profile" : "feed";
  if (next === "profile") {
    try { await loadProfile(+m[1]); } catch (err) { toast(err.message); location.hash = "#/"; return; }
  }
  if (next !== view) window.scrollTo({ top: 0 });
  view = next;
  $("#feedView").hidden = view !== "feed";
  $("#profileView").hidden = view !== "profile";
  (view === "feed" ? $("#profileFeed") : $("#feed")).innerHTML = "";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", view === "feed" && a.dataset.filter === filter));
  render(false);
}
window.addEventListener("hashchange", () => { if (me) route(); });
function openProfile(id) {
  const target = id === "me" ? me.id : +id;
  const hash = `#/u/${target}`;
  if (location.hash === hash) route(); else location.hash = hash;
}

// ---------------------------------------------------------------- edit profile
let pPhoto;   // undefined = unchanged, null = remove, data URL = new photo
function photoPreview() {
  const src = pPhoto === undefined ? me.avatar : pPhoto;
  $("#pPhotoPreview").innerHTML = avatarHTML($("#pName").value.trim() || profile.signInName || me.name, src, "xl");
  $("#pPhotoRemove").hidden = !src;
}
function openProfileEditor() {
  const p = profile;
  pPhoto = undefined;
  $("#pName").value = p.displayName || "";
  $("#pName").placeholder = p.signInName || "";
  $("#pNameHint").textContent = t("displayNameHint", { name: p.signInName || "" });
  $("#pPosition").value = p.position || "";
  $("#pBio").value = p.bio || "";
  $("#pBioCount").textContent = $("#pBio").value.length;
  $("#pDept").value = p.dept || "—";
  $("#pEmail").value = p.email;
  $("#pErr").textContent = "";
  photoPreview();
  $("#profileScrim").classList.add("open");
}
function closeProfileEditor() { $("#profileScrim").classList.remove("open"); }
$("#pPhotoPick").addEventListener("click", () => $("#pPhotoFile").click());
$("#pPhotoRemove").addEventListener("click", () => { pPhoto = null; photoPreview(); });
$("#pPhotoFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { pPhoto = await resizeImage(file, 320, true); photoPreview(); } catch (err) { toast(err.message); }
});
$("#pBio").addEventListener("input", e => $("#pBioCount").textContent = e.target.value.length);
$("#pName").addEventListener("input", () => { if (!$("#pPhotoPreview img")) photoPreview(); });
$("#profileForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#pSave");
  btn.disabled = true; btn.textContent = t("saving"); $("#pErr").textContent = "";
  const body = { displayName: $("#pName").value, position: $("#pPosition").value, bio: $("#pBio").value };
  if (pPhoto !== undefined) body.avatar = pPhoto;
  try {
    const { user } = await api("PUT", "/api/me", body);
    profile = user;
    me = { ...me, name: user.name, position: user.position, avatar: user.avatar };
    renderMe();
    closeProfileEditor();
    await load(false, true);    // names and photos on posts and comments changed
    render(false);
    toast(t("saved"));
  } catch (err) {
    $("#pErr").textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = t("save");
  }
});

// ---------------------------------------------------------------- reactions
let reorderTimer = null, pickerTimer = null, openWrap = null;
const reactQueue = {};   // ideaId -> promise, so rapid clicks reach the server in order

function openPicker(wrap) { closePicker(); wrap.classList.add("open"); openWrap = wrap; }
function closePicker() { clearTimeout(pickerTimer); openWrap?.classList.remove("open"); openWrap = null; }
if (canHover) {
  // hover the React button to choose an emoji
  document.addEventListener("mouseover", e => {
    const wrap = e.target.closest(".react-wrap");
    clearTimeout(pickerTimer);
    if (wrap && wrap !== openWrap) pickerTimer = setTimeout(() => openPicker(wrap), 350);
    else if (!wrap && openWrap) pickerTimer = setTimeout(closePicker, 300);
  });
}

function applyReaction(idea, from, to) {
  if (from) idea.r[from] = Math.max(0, (idea.r[from] || 0) - 1);
  if (from && !idea.r[from]) delete idea.r[from];
  if (to) idea.r[to] = (idea.r[to] || 0) + 1;
  idea.myReaction = to;
}
function redrawCard(idea, pop) {
  const card = document.querySelector(`[data-post="${idea.id}"]`);
  if (!card) return;
  card.outerHTML = postHTML(idea);
  if (pop) document.querySelector(`[data-post="${idea.id}"] .act.mine`)?.classList.add("pop");
}
function scheduleReorder() {
  // re-rank shortly after, so the card doesn't jump away from under the cursor
  clearTimeout(reorderTimer);
  reorderTimer = setTimeout(() => { reorderTimer = null; if (!typing()) render(true); }, 900);
}

function react(id, kind) {
  const idea = ideas.find(i => i.id === id);
  if (!idea) return;
  closePicker();
  const prev = idea.myReaction || null;
  const next = prev === kind ? null : kind;
  applyReaction(idea, prev, next);
  redrawCard(idea, !!next);
  renderSide();
  scheduleReorder();
  reactQueue[id] = (reactQueue[id] || Promise.resolve()).then(async () => {
    try {
      const res = await api("PUT", `/api/ideas/${id}/reaction`, { kind: next });
      // only the latest click decides what's shown; take the server's counts
      if (idea.myReaction === next && JSON.stringify(res.r) !== JSON.stringify(idea.r)) {
        idea.r = res.r; redrawCard(idea); renderSide();
      }
    } catch (err) {
      if (idea.myReaction === next) { applyReaction(idea, next, prev); redrawCard(idea); renderSide(); }
      toast(err.message);
    }
  });
}

async function deleteIdea(id) {
  const idea = ideas.find(i => i.id === id);
  if (!idea || !confirm(t("confirmDelete", { title: idea.title }))) return;
  try {
    await api("DELETE", `/api/ideas/${id}`);
    ideas = ideas.filter(i => i !== idea);
    if (view === "profile") await loadProfile(profile.id);
    render(true);
    toast(t("deleted"));
  } catch (err) { toast(err.message); }
}

// ---------------------------------------------------------------- comments
const typing = () => document.activeElement?.matches?.(".comment-input, #q");

async function postComment(id, form) {
  const input = form.querySelector(".comment-input");
  const body = input.value.trim();
  if (!body) return;
  input.disabled = true;
  try {
    const { comment } = await api("POST", `/api/ideas/${id}/comments`, { body });
    const idea = ideas.find(i => i.id === id);
    delete drafts[id];
    if (idea) {
      idea.comments.push(comment);
      redrawCard(idea);
      document.querySelector(`[data-comment-input="${id}"]`)?.focus();
    }
    if (view === "profile" && profile?.me) profile.stats.comments++;
  } catch (err) {
    input.disabled = false;
    toast(err.message);
  }
}

async function deleteComment(commentId, ideaId) {
  if (!confirm(t("confirmDeleteComment"))) return;
  try {
    await api("DELETE", `/api/comments/${commentId}`);
    const idea = ideas.find(i => i.id === ideaId);
    if (idea) { idea.comments = idea.comments.filter(c => c.id !== commentId); redrawCard(idea); }
  } catch (err) { toast(err.message); }
}

// ---------------------------------------------------------------- events
document.addEventListener("click", e => {
  const el = e.target;
  if (openWrap && !el.closest(".react-wrap")) closePicker();

  const pick = el.closest("[data-pick]");
  if (pick) return react(+pick.dataset.id, pick.dataset.pick);
  const main = el.closest("[data-react-main]");
  if (main) {
    const id = +main.dataset.reactMain, idea = ideas.find(i => i.id === id);
    if (!canHover) {          // touch: tap opens the emoji row
      const wrap = main.closest(".react-wrap");
      return wrap === openWrap ? closePicker() : openPicker(wrap);
    }
    return react(id, idea?.myReaction || "bulb");   // click: quick 💡, or undo your reaction
  }
  const chip = el.closest("[data-react]");
  if (chip) return react(+chip.dataset.id, chip.dataset.react);
  const exp = el.closest("[data-expand]");
  if (exp) {
    const id = +exp.dataset.expand, idea = ideas.find(i => i.id === id);
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    return idea && redrawCard(idea);
  }
  const fc = el.closest("[data-focus-comment]");
  if (fc) return document.querySelector(`[data-comment-input="${fc.dataset.focusComment}"]`)?.focus();
  const dc = el.closest("[data-del-comment]");
  if (dc) return deleteComment(+dc.dataset.delComment, +dc.dataset.id);
  const del = el.closest("[data-delete]");
  if (del) return deleteIdea(+del.dataset.delete);
  const ed = el.closest("[data-edit]");
  if (ed) return openModal(ideas.find(i => i.id === +ed.dataset.edit));
  const prof = el.closest("[data-profile]");
  if (prof) { e.preventDefault(); return openProfile(prof.dataset.profile); }
  if (el.closest("[data-go-feed]")) { location.hash = "#/"; return; }
  if (el.closest("[data-edit-profile]")) return openProfileEditor();
  if (el.closest("[data-sign-out]")) return signOut();
  const lg = el.closest("[data-lang]");
  if (lg) return setLang(lg.dataset.lang, true);
  const tag = el.closest("[data-tag]");
  if (tag) { setFilter("#" + tag.dataset.tag); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const f = el.closest("[data-filter]");
  if (f) { e.preventDefault(); setFilter(f.dataset.filter); return; }
  const s = el.closest("[data-sort]");
  if (s) { setSort(s.dataset.sort); render(true); return; }
  if (el.closest("[data-sort-link]")) {
    e.preventDefault(); setSort("top"); setFilter("all"); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (el.closest("[data-open-new]")) return openModal();
  if (el.closest("[data-close]") || el === $("#scrim")) return closeModal();
  if (el.closest("[data-close-profile]") || el === $("#profileScrim")) return closeProfileEditor();
});
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-comment-form]");
  if (!form) return;
  e.preventDefault();
  postComment(+form.dataset.commentForm, form);
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-comment-input]")) drafts[e.target.dataset.commentInput] = e.target.value;
});
$("#q").addEventListener("input", e => { query = e.target.value.trim(); if (view !== "feed") location.hash = "#/"; else render(false); });

async function signOut() {
  await api("POST", "/api/logout", {}).catch(() => {});
  location.hash = "";
  location.reload();
}

// ---------------------------------------------------------------- sign-in
function showSignIn() {
  me = null;
  $("#signin").hidden = false;
  setTimeout(() => $("#sEmail").focus(), 50);
}
function renderMe() {
  $("#meBtn").innerHTML = avatarHTML(me.name, me.avatar, "sm");
}
async function startApp(user) {
  me = user;
  $("#signin").hidden = true;
  try {
    me = (await api("GET", "/api/me")).user || user;   // full profile: photo, language
  } catch {}
  if (me.lang && me.lang !== lang) setLang(me.lang, false);
  else if (!me.lang) api("PUT", "/api/me/lang", { lang }).catch(() => {});
  renderMe();
  try { await load(false, true); } catch (err) { toast(err.message); }
  route();
}
$("#signinForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#sErr").textContent = "";
  $("#sBtn").disabled = true;
  try {
    const { user } = await api("POST", "/api/login", {
      email: $("#sEmail").value, password: $("#sPass").value,
    });
    $("#sPass").value = "";
    startApp(user);
  } catch (err) {
    $("#sErr").textContent = err.message;
  } finally {
    $("#sBtn").disabled = false;
  }
});

// ---------------------------------------------------------------- new idea
let fType = "hack", fImg = null;                                // fImg = newly chosen image (data URL)
let editing = null, fImgExisting = null, fImgRemoved = false;   // edit mode: the idea and its current image
function setType(type) {
  fType = type;
  document.querySelectorAll(".type-opt").forEach(x => x.classList.toggle("on", x.dataset.type === type));
}
function resetForm() {
  editing = null; fImgExisting = null; fImgRemoved = false;
  $("#form").reset(); clearImage(); setType("hack");
  $("#tCount").textContent = 0; $("#fErr").textContent = "";
  $("#submitBtn").disabled = true;
}
function openModal(idea) {
  if (idea || editing) resetForm();   // switching between a new idea and an edit starts clean
  if (idea) {
    editing = idea;
    setType(idea.type);
    $("#fTitle").value = idea.title;
    $("#fDesc").value = idea.desc;
    $("#fTags").value = idea.tags.join(", ");
    $("#tCount").textContent = idea.title.length;
    $("#submitBtn").disabled = false;
    fImgExisting = idea.img;
    showImage();
  }
  $("#formTitle").textContent = t(editing ? "editTitle" : "newTitle");
  $("#submitBtn").textContent = t(editing ? "saveChanges" : "postIdea");
  $("#scrim").classList.add("open");
  setTimeout(() => $("#fTitle").focus(), 50);
}
function closeModal() {
  $("#scrim").classList.remove("open");
  if (editing) resetForm();           // a new-idea draft is kept; an unsaved edit is dropped
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeProfileEditor(); closePicker(); } });
document.querySelectorAll(".type-opt").forEach(b => b.addEventListener("click", () => setType(b.dataset.type)));
$("#fTitle").addEventListener("input", e => {
  $("#tCount").textContent = e.target.value.length;
  $("#submitBtn").disabled = !e.target.value.trim();
});

// Shrink photos in the browser before upload (JPEG). square = centre-crop, for profile photos.
function resizeImage(file, max = 1600, square = false) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (square) { const side = Math.min(sw, sh); sx = (sw - side) / 2; sy = (sh - side) / 2; sw = sh = side; }
      const scale = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement("canvas");
      c.width = Math.round(sw * scale);
      c.height = Math.round(sh * scale);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t("badImage"))); };
    img.src = url;
  });
}
function showImage() {
  const src = fImg || (!fImgRemoved && fImgExisting);
  $("#drop").innerHTML = src ? `<img src="${esc(src)}" alt=""><span class="rm" id="rmImg">${t("remove")}</span>` : t("dropEmpty");
}
async function setImage(file) {
  if (!file) return;
  try {
    fImg = await resizeImage(file);
    showImage();
  } catch (err) { toast(err.message); }
}
function clearImage() {
  fImg = null;
  $("#fImg").value = "";
  if (fImgExisting) fImgRemoved = true;
  showImage();
}
$("#drop").addEventListener("click", e => {
  if (e.target.id === "rmImg") { e.stopPropagation(); clearImage(); } else $("#fImg").click();
});
$("#fImg").addEventListener("change", e => setImage(e.target.files[0]));
$("#drop").addEventListener("dragover", e => e.preventDefault());
$("#drop").addEventListener("drop", e => { e.preventDefault(); setImage(e.dataTransfer.files[0]); });

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("#fTitle").value.trim();
  if (!title) return;
  const btn = $("#submitBtn");
  btn.disabled = true; btn.textContent = t(editing ? "saving" : "posting"); $("#fErr").textContent = "";
  const body = {
    type: fType, title, desc: $("#fDesc").value,
    tags: $("#fTags").value.split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean),
  };
  try {
    if (editing) {
      if (fImg) body.image = fImg; else if (fImgRemoved) body.image = null;   // otherwise keep the image
      const { idea } = await api("PUT", `/api/ideas/${editing.id}`, body);
      const at = ideas.findIndex(i => i.id === idea.id);
      if (at >= 0) ideas[at] = idea;
      closeModal();
      render(false);
      toast(t("updated"));
      return;
    }
    const { idea } = await api("POST", "/api/ideas", { ...body, image: fImg });
    ideas.unshift(idea);
    resetForm();
    closeModal();
    setSort("new");
    if (view !== "feed") { filter = "all"; location.hash = "#/"; } else setFilter("all");
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast(t("toastLive"));
  } catch (err) {
    $("#fErr").textContent = err.message;
  } finally {
    btn.textContent = t(editing ? "saveChanges" : "postIdea");
    btn.disabled = !$("#fTitle").value.trim();
  }
});

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("show"), 2800);
}

// ---------------------------------------------------------------- countdown & live refresh
const deadline = new Date(HACKATHON_DEADLINE).getTime();
function tick() {
  const d = Math.max(0, deadline - Date.now());
  const v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60];
  document.querySelectorAll("#countdown b").forEach((b, n) => b.textContent = String(v[n]).padStart(2, "0"));
}
tick(); setInterval(tick, 30e3);

async function refresh() {
  // don't redraw under someone who is typing a comment or has the emoji row open
  if (!me || document.hidden || reorderTimer || typing() || openWrap) return;
  try {
    if (view === "profile" && profile) await loadProfile(profile.id);
    await load(true, view === "profile");
  } catch {}
}
setInterval(refresh, POLL_MS);
document.addEventListener("visibilitychange", refresh);

// ---------------------------------------------------------------- start
applyI18n();
api("GET", "/api/me")
  .then(({ user, emailDomain }) => {
    if (emailDomain) $("#sEmail").placeholder = "you@" + emailDomain;
    user ? startApp(user) : showSignIn();
  })
  .catch(() => toast(t("cantReach")));
</script>
